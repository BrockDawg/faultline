# metahackathon.pitbot.gg: the faultline live demo page.
# Static page and bundle from /srv/faultline/www; /api/ goes to the replay worker on 127.0.0.1:8711
# (faultline-site.service). The docroot sits outside /srv/www/brockweb/dev/ so the leagues' regex
# vhost never treats it as a league; the exact server_name below wins over that regex.
# Install: deploy/site/install.sh copies this to /etc/nginx/sites-available/metahackathon.pitbot.gg,
# links it into sites-enabled, runs nginx -t, and reloads only when the test passes.

# A file in sites-enabled is included inside the http block, so this zone is declared at http level.
# One bucket per visitor address: 10 requests a minute to /api/.
limit_req_zone $binary_remote_addr zone=faultline:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name metahackathon.pitbot.gg;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name metahackathon.pitbot.gg;

    ssl_certificate     /etc/letsencrypt/live/pitbot.gg/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pitbot.gg/privkey.pem;

    root /srv/faultline/www;
    index index.html;

    # If the DNS record is proxied through Cloudflare, add one set_real_ip_from line per
    # Cloudflare range here, plus: real_ip_header CF-Connecting-IP;
    # so $binary_remote_addr and X-Real-IP name the visitor, not Cloudflare.

    # Server-level headers. No location below uses add_header, so every response inherits them.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'" always;
    add_header Referrer-Policy "no-referrer" always;

    # First, so its regex locations win over the cache regex below.
    include snippets/deny-backups.conf;

    # ^~ keeps every regex location (the cache rule, the deny snippet) off the API paths.
    # The job event stream: one GET per run the visitor already started (and was counted for), so
    # no rate limit here; the worker's own per-visitor queue limit still applies to the POSTs.
    location ^~ /api/jobs/ {
        proxy_pass http://127.0.0.1:8711;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # Starting a run, health and the deploy-time replay: 10 a minute per visitor, burst 5.
    location ^~ /api/ {
        limit_req zone=faultline burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8711;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # The job stream is server-sent events: no buffering, long reads.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    location ~* \.(json|jpg)$ { expires 1h; }
    location / { try_files $uri $uri/ =404; }
}
