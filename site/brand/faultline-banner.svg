<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="460" viewBox="0 0 1600 460" role="img" aria-labelledby="title desc">
  <title id="title">faultline — evidence, then ruling</title>
  <desc id="desc">A dark technical banner with three evidence traces meeting a marked fault line.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#14252b"/><stop offset="1" stop-color="#1a3036"/></linearGradient>
    <linearGradient id="fade" x1="0" x2="1"><stop stop-color="#fff" stop-opacity=".05"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0v40" fill="none" stroke="#a9c2bb" stroke-opacity=".075"/></pattern>
  </defs>
  <rect width="1600" height="460" rx="24" fill="url(#bg)"/>
  <rect width="1600" height="460" rx="24" fill="url(#grid)"/>
  <rect width="900" height="460" rx="24" fill="url(#fade)"/>
  <g transform="translate(112 100)">
    <rect width="88" height="88" rx="24" fill="#203b40" stroke="#79d4c2" stroke-opacity=".35"/>
    <g fill="none" stroke-linecap="round" stroke-width="5">
      <path d="M17 25h20m22 0h31M17 44h16m30 0h27M17 63h20m22 0h31" stroke="#d9e8e1"/>
      <path d="m47 12-6 19 10 11-10 15 10 10-5 12" stroke="#f18a74"/>
    </g>
    <circle cx="47" cy="44" r="3.5" fill="#f18a74"/>
    <text x="116" y="63" fill="#f2f5f1" font-family="Arial,Helvetica,sans-serif" font-size="66" font-weight="700" letter-spacing="-3">faultline</text>
    <text x="118" y="103" fill="#9ab9b0" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" letter-spacing="3">EVIDENCE → RULING</text>
  </g>
  <g transform="translate(116 270)">
    <text fill="#f3f5f1" font-family="Arial,Helvetica,sans-serif" font-size="41" font-weight="600" letter-spacing="-1">A rules judge for video.</text>
    <text y="49" fill="#afc2bc" font-family="Arial,Helvetica,sans-serif" font-size="22">Scripts measure and decide. Models perceive and describe.</text>
  </g>
  <g fill="none" stroke-linecap="round">
    <path d="M930 130h230l28-22 35 22h260" stroke="#79d4c2" stroke-width="3"/>
    <path d="M880 225h305l30 18 33-18h235" stroke="#d8e6e0" stroke-opacity=".78" stroke-width="3"/>
    <path d="M980 325h190l28-20 35 20h250" stroke="#79d4c2" stroke-opacity=".72" stroke-width="3"/>
    <path d="m1200 91-14 57 19 24-18 47 22 30-17 55 12 53" stroke="#f18a74" stroke-width="3"/>
  </g>
  <circle cx="1205" cy="225" r="9" fill="#f18a74"/><circle cx="1205" cy="225" r="21" fill="none" stroke="#f18a74" stroke-opacity=".35"/>
  <g fill="#8ba69e" font-family="monospace" font-size="12" letter-spacing="2">
    <text x="965" y="112">FRAME TRACE</text><text x="980" y="207">RULE CHECK</text><text x="1008" y="307">MEASURED FACT</text>
    <text x="1238" y="271">REVIEW POINT</text>
  </g>
</svg>
